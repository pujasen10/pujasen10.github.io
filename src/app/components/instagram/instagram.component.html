<section class="section insta" id="instagram">
  <div class="section-header">
    <span class="section-eyebrow">&#64;theloopylooms</span>
    <h2 class="section-title">Follow along on <em>Instagram</em></h2>
    <p class="section-sub">
      See the latest creations, process videos, and floral daydreams over on our Instagram.
    </p>
  </div>

  <!-- doodle: corner botanical sprig -->
  <svg class="doodle" aria-hidden="true"
       style="top:2.5rem;right:3%;width:72px;opacity:.16;"
       viewBox="0 0 80 105" fill="none">
    <path d="M10,100C13,82 22,65 34,52C46,39 62,28 68,14"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M34,52C22,46 14,35 18,23C23,34 30,44 34,52" fill="currentColor" opacity=".65"/>
    <path d="M34,52C46,48 54,37 52,25C48,36 41,46 34,52" fill="currentColor" opacity=".65"/>
    <path d="M54,28C44,22 38,12 43,3C47,13 52,22 54,28" fill="currentColor" opacity=".5"/>
    <circle cx="70" cy="12" r="2.5" fill="currentColor" opacity=".5"/>
  </svg>

  <div class="insta-grid">
    @for (photo of photos; track photo.src) {
      <a [href]="igUrl" target="_blank" rel="noopener" class="insta-item">
        <img [src]="photo.src" alt="Handmade crochet creation" />
        <div class="insta-overlay">
          <svg viewBox="0 0 24 24">

        </div>
      </a>
    }
  </div>

  <div class="insta-cta">
    <a [href]="igUrl" target="_blank" rel="noopener" class="btn-primary">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
